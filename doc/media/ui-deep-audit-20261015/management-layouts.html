<body>
<header><h1>管理页布局示意</h1><p>设计候选 · 演示数据 · 可切换页面、密度、字号，搜索与选择条目。仅用于评审布局，不连接游戏存档。</p><p><a href="../../08_界面与交互/08_管理页操作与信息密度专项.md">逐页分析与方案取舍</a> · <a href="review.html">204 项方案清单</a></p></header>
<main>
<nav id="pages" class="pages" aria-label="管理页示意"></nav>
<div class="tools"><label>间距<select id="density"><option value="comfortable">舒适</option><option value="compact">紧凑</option></select></label><label>阅读字号<select id="font"><option value="16">标准</option><option value="20">放大 125%</option><option value="24">大字 150%</option></select></label><label>查找<input id="search" type="search" placeholder="当前页内查找" autocomplete="off"></label><button id="clear">清除查找</button><span id="measure" class="hint" aria-live="polite"></span></div>
<section id="canvas" class="canvas" aria-label="示意工作区">
<div class="context"><strong id="page-title"></strong><span id="page-summary"></span></div>
<div class="workspace"><section class="directory" aria-label="对象目录"><div class="directory-head"><strong id="list-title"></strong><span id="count"></span></div><div id="items" class="items"></div></section><section class="inspector" aria-label="所选对象详情"><div id="detail" class="detail"></div></section></div>
<div class="action-context"><strong id="intent"></strong><span>演示只读 · 实际执行需接入游戏规则与保存校验</span></div>
</section>
<p class="footer-note">密度切换只改变间距，字号独立。首屏条目数只测量当前浏览器示意中的完整目录行，不是实机效率数据。大字与窄屏允许增加行高、重排内容。</p>
</main>
<script>
const icon='<svg aria-hidden="true" viewBox="0 0 28 28"><path d="M4 8 14 3 24 8v13l-10 5L4 21Z M4 8l10 5 10-5 M14 13v13 M9 5l10 5v6"/></svg>';
const table=(heads,rows)=>'<table><thead><tr>'+heads.map(x=>'<th scope="col">'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map((v,i)=>i===0?'<th scope="row">'+v+'</th>':'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
const note=t=>'<div class="callout">'+t+'</div>';
const cap=(label,current,delta,max)=>'<div class="metric"><span>'+label+'</span><strong>'+current+' → '+(current+delta)+' / '+max+' 格</strong><div class="track" role="img" aria-label="当前 '+current+' 格，增加 '+delta+' 格，容量 '+max+' 格"><span class="used" style="width:'+current/max*100+'%"></span><span class="delta" style="width:'+delta/max*100+'%"></span></div><div class="legend">实色：当前 · 斜线：本次增加 · 空白：剩余</div></div>';
const item=(title,status,summary,detail,intent)=>({title,status,summary,detail,intent});
const cards=[['锤击','2','1 / 0','单体伤害','守备铁锤'],['架盾猛击','1','1 / 0','伤害＋护盾','守备铁锤'],['坚守','2','1 / 0','获得护盾','铆钉护甲'],['横扫','1','2 / 0','攻击所有存活敌人','武器'],['稳固','1','1 / 0','防护','身体装备'],['预备工具','1','1 / 0','额外抽牌，有回合上限','检修工具手套'],['掩护射击','2','1 / 0','伤害＋护盾','检修工具手套']];
const stock=[['废钢',2,12,'材料','制作装备；可按计划保留'],['导能线',1,5,'材料','用于已知配方'],['精密弹簧',0,6,'材料','配方材料'],['再生织物',0,2,'材料','背包与补给材料'],['密封树脂',0,1,'材料','背包材料'],['普通密封补给',1,3,'补给','可留仓，使用恢复生命'],['校准夹具',1,0,'任务物','需核对校准状态与位置'],['回响护腕',0,1,'装备','带作备用与穿戴含义不同']];
const pages={
stock:{name:'仓储',summary:'当前穿戴折为摘要 · 两处数量对齐 · 选中后看后果',list:'物资｜随身 / 仓库',items:stock.map(([name,carry,warehouse,type,purpose],i)=>item(name,type,'随身 '+carry+' · 仓库 '+warehouse, '<p class="label">物品 · '+type+' · 实际批次在执行前区分</p><h2>'+name+'</h2>'+table(['位置','数量','状态'],[['随身',String(carry),'当前持有'],['仓库',String(warehouse),'可在营地访问']])+'<p>'+purpose+'</p>'+ (i===0?'<h3>取出 3 件的布局示例</h3>'+cap('随身容量',3,1,12)+note('这里的 3 → 4 格是演示结果，不按数量线性推算。实装须用真实堆叠与预览计算。'):'<div class="callout safe">所选对象、来源、数量和去向共同决定操作。相同名称但配发／校准／登记状态不同的实物必须分别处理。</div>'),i===0?'所选：仓库废钢 · 数量 3 · 去向：随身':'所选：'+name+' · 可查看来源、用途与取放后果'))},
gear:{name:'装备',summary:'当前与候选同行比较 · 变化优先 · 完整供牌按需展开',list:'武器候选',items:[
item('守备铁锤','候选','4 kg · 供牌取舍','<p class="label">当前：折页清障铲 → 候选：守备铁锤</p><h2>先看得到和失去的能力</h2>'+table(['比较项','当前','候选'],[['部位重量','4.5 kg','4 kg（−0.5）'],['锤击副本','2','3（＋1）'],['横扫副本','1','0（−1）'],['总牌数','10','10（不变）']])+note('总牌数相同不代表能力相同：此示意减少全体攻击，增加单体攻击。')+'<details><summary>查看完整候选供牌与条件</summary><p>完整规则在此展开，不重复占据差异首屏。实际供牌必须读取当前装备和改装状态。</p></details>','比较对象：守备铁锤 · 穿戴改变供牌；备用只移动实物'),
item('导能短杖','候选','魔法费用单独比较','<h2>导能短杖</h2>'+table(['字段','比较方式'],[['行动费用','按供牌逐项比较'],['魔法费用','保留独立列，不与行动费相加'],['旧装备去向','执行前检查真实容量']])+note('数值未在此稿模拟；不得用一个总战力替代具体取舍。'),'先查看供牌与位置条件，再决定穿戴'),
item('折页清障铲','当前','已穿戴','<h2>当前穿戴</h2><p>当前对象仍可查看，但不显示一个看似可执行的重复“已穿戴”主按钮。</p>','当前装备 · 只读查看')]},
deck:{name:'角色卡组',summary:'示意常驻构筑 10 张 · 按牌种汇总 · 来源可以追溯',list:'牌种｜副本 · 行动 / 魔法',items:cards.map(c=>item(c[0],'×'+c[1],c[2]+' · '+c[3],'<p class="label">统计范围：演示常驻构筑，不代表实机当前存档</p><h2>'+c[0]+' ×'+c[1]+'</h2>'+table(['费用／来源','内容'],[['行动 / 魔法',c[2]],['效果摘要',c[3]],['来源',c[4]]])+'<details open><summary>来源数量示意</summary>'+table(['来源','提供副本'],[[c[4],c[1]]])+'</details>'+note('点击卡名主动打开详情。战斗临时牌与试用借装需显示独立来源；不显示抽牌顺序。'),'只读查看 '+c[0]+' · 不执行出牌'))},
craft:{name:'装备制作',summary:'目录显示状态 · 条件与产物分开 · 成本去向明确',list:'配方目录',items:[
item('焙铸破甲锤','缺材料','图纸 · 成品放入仓库','<p class="label">配方／图纸 · 不是当前库存物品</p><h2>制作前把条件看全</h2>'+table(['条件','状态'],[['解锁','已满足'],['材料','缺精密弹簧 1'],['成品空间','仍需以执行预览核对'],['拥有状态','未持有']])+ '<h3>成本示例</h3>'+table(['材料','拥有','消耗','剩余／缺口'],[['废钢','12','4','剩余 8'],['精密弹簧','1','2','缺 1']])+note('不同材料不相加计算“总完成度”。这里只展示条件布局，成本数字为演示。'),'配方：焙铸破甲锤 · 缺料时先给来源与整理入口'),
item('检修工具手套','已持有','成品 · 可查看与比较','<p class="label">实物：已持有 · 具体位置按存档读取</p><h2>检修工具手套</h2><p>主区优先查看成品、当前改装和供牌。已完成制作时不再把缺料红字和禁用大按钮当主内容。</p><details><summary>查看历史配方成本</summary><p>配方知识仍保留，但与本次将要消耗的材料分开。</p></details>','已持有 · 查看实物与穿戴条件'),
item('回响护腕','可制作','图纸 · 核对产物空间','<h2>回响护腕配方</h2><p>解锁、材料、拥有状态和空间分别表达。制作成功后提供比较／装备入口，是否穿戴由玩家另行决定。</p>','制作与装备分为两个明确决定')]},
mods:{name:'供牌改装',summary:'先选装备 · 一次比较一个方案 · 明确只换一张副本',list:'装备与方案',items:[
item('守备铁锤 · 盾刃','未购买','替换一张锤击副本','<h2>锤击 → 盾刃</h2><div class="route"><span>锤击 ×3</span><b>→</b><span>锤击 ×2 ＋ 盾刃 ×1</span></div>'+table(['效果','基础副本','改装副本'],[['行动 / 魔法','1 / 0','1 / 0'],['伤害','8','6（−2）'],['护盾','0','3（＋3）']])+note('数字用于说明副本替换结构。购买范围是当前装备；不同效果是取舍，不能用全绿“升级”掩盖伤害下降。'),'当前装备：守备铁锤 · 未购方案的执行动作为购买并安装'),
item('铆钉护甲 · 应急加固','已购未装','切换免费','<h2>坚守 → 应急加固</h2>'+table(['效果','基础','改装'],[['护盾','9','6（−3）'],['额外抽牌','0','1（＋1）']])+note('抽牌仍受每回合真实上限约束。已购买与正在生效是两个独立状态。'),'方案已购买 · 安装前检查当前状态'),
item('修补工装 · 应急加固','已安装','切回基础版免费','<h2>当前已安装</h2><p>已安装状态显示在装备和方案上。切回基础版的结果用同一差异表反向预览，避免再次显示购买按钮。</p>','当前方案生效 · 可查看切回基础的取舍')]},
bags:{name:'背包与仓储',summary:'三种背包同表比较 · 补给与扩仓各有直达入口',list:'管理任务',items:[
item('背包比较','三种方案','容量 · 自重 · 状态','<h2>背包规格对照</h2>'+table(['背包','总容量','自重','状态'],[['拼布挎包','12 格','1 kg','已持有'],['加固行囊','16 格','1.5 kg','缺材料'],['承架背包','20 格','2 kg','待解锁']])+note('总容量包括 4 格基础口袋。换小包必须能放下现有随身物及换下装备，不能只看容量增量。')+'<details><summary>展开所选背包的成本与更换预览</summary><p>一次只展开当前方案。未解锁与已持有分别给出状态，不重复三组大按钮。</p></details>','先选方案比较，再决定制作或装备'),
item('制作补给','独立入口','一次产出与制作次数分开','<h2>普通密封补给</h2>'+table(['字段','示例'],[['制作次数','3 次'],['每次产出','2 份'],['总产出','6 份'],['成品去向','仓库，实际容量需预览']])+note('普通补给可留仓；本趟免费配发是不同来源。示例不实际消耗材料。'),'确认次数、产量、成本与空间'),
item('仓库扩建','独立入口','当前与升级后容量','<h2>扩仓前看清新增空间</h2>'+table(['信息','应显示内容'],[['当前容量','真实仓库容量'],['升级后容量','真实下一等级容量'],['前置条件','任务／材料状态']])+'<p>从目录直接进入，不必先滚过三种背包。</p>','查看升级条件与容量变化')]},
journal:{name:'任务与日志',summary:'下一步优先 · 交付前看结果 · 长记录分组展开',list:'任务与记录',items:[

let current='stock';const memory={};const $=id=>document.getElementById(id);
function state(){return memory[current]??(memory[current]={query:'',index:0,scroll:0});}
function showDetail(index){const s=state();s.index=index;const selected=pages[current].items[index];$('detail').innerHTML=selected.detail;$('detail').scrollTop=0;$('intent').textContent=selected.intent;document.querySelectorAll('.item').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.index)===index)));}
function render(){const p=pages[current],s=state();$('page-title').textContent=p.name;$('page-summary').textContent=p.summary;$('list-title').textContent=p.list;$('search').value=s.query;$('items').replaceChildren();const indices=p.items.map((x,i)=>i).filter(i=>(p.items[i].title+' '+p.items[i].status+' '+p.items[i].summary).toLocaleLowerCase().includes(s.query.trim().toLocaleLowerCase()));$('count').textContent=indices.length+' / '+p.items.length;
for(const index of indices){const x=p.items[index],b=document.createElement('button');b.className='item';b.dataset.index=index;b.innerHTML=icon+'<span><span class="name">'+x.title+'</span><span class="state">'+x.status+'</span><span class="meta">'+x.summary+'</span></span>';b.addEventListener('click',()=>showDetail(index));$('items').append(b);}
if(indices.length)showDetail(indices.includes(s.index)?s.index:indices[0]);else{$('items').innerHTML='<p class="empty">没有符合条件的条目。可清除查找返回本页全部内容。</p>';$('detail').innerHTML='<h2>当前查找无结果</h2><p>这不表示全部库存为空，也不代表没有配方。</p>';$('intent').textContent='无选中对象';}
$('items').scrollTop=s.scroll;document.querySelectorAll('.pages button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===current)));requestAnimationFrame(fit);}
for(const [id,p] of Object.entries(pages)){const b=document.createElement('button');b.textContent=p.name;b.dataset.page=id;b.addEventListener('click',()=>{state().scroll=$('items').scrollTop;current=id;render();});$('pages').append(b);}
function fit(){if(innerWidth>850){const top=document.querySelector(".workspace").getBoundingClientRect().top+scrollY;const footer=document.querySelector(".action-context").getBoundingClientRect().height;$("canvas").style.setProperty("--workspace-height",Math.max(240,innerHeight-top-footer-64)+"px");}measure();}
function measure(){const area=$('items').getBoundingClientRect();const rows=[...document.querySelectorAll('.item')];const visible=rows.filter(b=>{const r=b.getBoundingClientRect();return r.top>=Math.max(area.top,0)&&r.bottom<=Math.min(area.bottom,innerHeight);}).length;$('measure').textContent='示意目录完整可见 '+visible+' / '+rows.length+' 项';}
$('search').addEventListener('input',()=>{state().query=$('search').value;state().scroll=0;render();});$('clear').addEventListener('click',()=>{state().query='';state().scroll=0;render();$('search').focus();});$('density').addEventListener('change',()=>{$('canvas').classList.toggle('compact',$('density').value==='compact');requestAnimationFrame(fit);});$('font').addEventListener('change',()=>{$('canvas').style.setProperty('--type',$('font').value+'px');requestAnimationFrame(fit);});$('items').addEventListener('scroll',()=>{state().scroll=$('items').scrollTop;measure();});new ResizeObserver(measure).observe($('items'));addEventListener("resize",()=>requestAnimationFrame(fit));addEventListener("scroll",measure);render();
</script></body></html>
