<figure class="hero"><a href="hud/camp.png"><img src="hud/camp.png" alt="木刻风余火站，图标资源条、地点纸签、圆形物件标记和菱形出口"></a><figcaption><h2>HUD 与场景交互</h2><p>生命、补给、收获和目标用符号表达；圆形操作物件，菱形通向出口。停留鼠标或键盘聚焦可查看完整含义。</p></figcaption></figure>
<figure><a href="hud/equipment.png"><img loading="lazy" src="hud/equipment.png" alt="装备实物图鉴及带消耗、伤害、护盾和数量的小供牌卡"></a><figcaption><h2>装备与供牌图鉴</h2><p>穿戴实物、装备档案与供牌并排。小卡直接显示数量、消耗和效果，窄窗口自动换行。</p></figcaption></figure>
<figure><a href="hud/cargo.png"><img loading="lazy" src="hud/cargo.png" alt="携带物页面分别显示远征携带物和据点仓库"></a><figcaption><h2>携带品与仓库</h2><p>区分未登记收获、备用装备与已入库任务物。</p></figcaption></figure>
<figure><a href="hud/preparation.png"><img loading="lazy" src="hud/preparation.png" alt="行前整备窗口的装备、出征清单、路线选择和出发按钮"></a><figcaption><h2>行前整备</h2><p>出征清单与装备并排；从整备进入装备页后，Esc 返回整备。</p></figcaption></figure>
<figure><a href="hud/crafting.png"><img loading="lazy" src="hud/crafting.png" alt="工坊制造页显示材料、台架试用以及配方卡片"></a><figcaption><h2>工坊制作</h2><p>材料、配方状态和制作动作集中展示，免费试用单独标注。</p></figcaption></figure>
<figure><a href="hud/mods.png"><img loading="lazy" src="hud/mods.png" alt="改装页展示被替换的供牌和改装消耗"></a><figcaption><h2>供牌改装</h2><p>清楚标明替换关系、购买成本与免费切回状态。</p></figcaption></figure>
<figure><a href="hud/journal.png"><img loading="lazy" src="hud/journal.png" alt="任务窗口左侧按主支线分类，右侧显示旅途记录"></a><figcaption><h2>任务与发现</h2><p>任务进度和旅途记录并排阅读，可交付任务保留明确操作入口。</p></figcaption></figure>
<figure><a href="hud/map.png"><img loading="lazy" src="hud/map.png" alt="七个地点的插画缩略图、路线、当前位置及安全撤离标记"></a><figcaption><h2>插画路线图</h2><p>用地点缩略图识别去过的场景，标注当前位置和撤离点；未发现地点不展示，点击不会移动。</p></figcaption></figure>
<figure><a href="hud/help.png"><img loading="lazy" src="hud/help.png" alt="远征指引使用编号章节说明探索和战斗操作"></a><figcaption><h2>远征指引</h2><p>按探索、装备、回合、护盾与撤退组织说明。</p></figcaption></figure>
<figure class="hero"><a href="hud/battle.png"><img loading="lazy" src="hud/battle.png" alt="战斗界面集中显示行动魔法护盾和敌方攻击，底部手牌带纸质效果说明"></a><figcaption><h2>战斗 HUD 与手牌</h2><p>资源、敌方意图、结束回合各有固定位置；插画手牌用纸张承载卡名与效果。</p></figcaption></figure>
<figure><a href="hud/settlement.png"><img loading="lazy" src="hud/settlement.png" alt="撤离成功后的纸质收获报告与回营按钮"></a><figcaption><h2>远征结算</h2><p>纸质报告记录本次收获，回营按钮固定在窗口下方。</p></figcaption></figure>
<figure><a href="hud/compact-battle.png"><img loading="lazy" src="hud/compact-battle.png" alt="1100乘760窗口中的三名敌人及完整手牌"></a><figcaption><h2>1100 × 760 的战斗</h2><p>保留文字尺寸，验证三名敌人、目标选择和手牌的可见范围。</p></figcaption></figure>
<h2 class="section-label" id="world">重绘的外环</h2>
<figure><a href="hud/gate.png"><img loading="lazy" src="hud/gate.png" alt="入口营地的帐篷、归途车辆和两条道路"></a><figcaption><h2>入口营地</h2><p>宽阔天空和清晰剪影，出发与回程落在同一张场景中。</p></figcaption></figure>
<figure><a href="hud/square.png"><img loading="lazy" src="hud/square.png" alt="货运广场的吊车、货箱和工坊夹具"></a><figcaption><h2>货运广场</h2><p>用建筑体块和少量红色货物组织画面，留出中央行动区。</p></figcaption></figure>
<figure><a href="hud/scrap.png"><img loading="lazy" src="hud/scrap.png" alt="废料场里的继电器、废机和被困维修偶"></a><figcaption><h2>废料场</h2><p>废铁、机器和任务物保持不同轮廓。救援后，被困位置变为空地。</p></figcaption></figure>
<figure><a href="hud/workshop.png"><img loading="lazy" src="hud/workshop.png" alt="维修工坊工作台和打开的暗门"></a><figcaption><h2>维修工坊 · 熄灯之后</h2><p>检修灯熄灭，墙上的夹层入口显现。</p></figcaption></figure>
<figure><a href="hud/hidden-room.png"><img loading="lazy" src="hud/hidden-room.png" alt="深墨绿的秘密检修夹层，清晰的货单与折页铲"></a><figcaption><h2>荧光检修夹层</h2><p>暗室以大块深色和少量浅色刻线构成，顶部纸签保持可读。</p></figcaption></figure>
<figure><a href="hud/station.png"><img loading="lazy" src="hud/station.png" alt="通电后的外环货站、配电柜与升起的信号机"></a><figcaption><h2>外环货站 · 恢复通行</h2><p>修复配电柜后升起信号机，货站成为新的归途。</p></figcaption></figure>
<figure><a href="hud/train.png"><img loading="lazy" src="hud/train.png" alt="静止列车中的空座椅、包裹和回收物"></a><figcaption><h2>静止列车</h2><p>窗框与长椅形成明确透视，包裹和物资可直接辨认。</p></figcaption></figure>
<figure><a href="hud/lit-home.png"><img loading="lazy" src="hud/lit-home.png" alt="完成任务后的余火站，灯光投影、维修偶和居民衣架"></a><figcaption><h2>让余火站有生活</h2><p>工作灯、旧日投影、维修偶和衣架随着任务完成而改变。</p></figcaption></figure>
